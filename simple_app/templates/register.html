{% extends "base.html" %}
{% block title %}Register - AgriConnect{% endblock %}

{% block content %}
<div class="relative max-w-md mx-auto py-6">
  <!-- soft blurred blobs behind the card, purely decorative -->
  <div class="absolute -top-8 -right-8 w-40 h-40 bg-gold/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-8 -left-8 w-40 h-40 bg-forest/15 rounded-full blur-3xl pointer-events-none"></div>

  <div class="relative">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-forest text-gold text-2xl mb-3 shadow-md">🌿</div>
      <h1 class="text-2xl font-semibold text-forest-dark">Create your account</h1>
      <p class="text-sm text-gray-500 mt-1">Join the AgriConnect community</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}"
          class="bg-white rounded-2xl border border-gray-100 shadow-xl p-6 space-y-4">

      <div>
        <label class="block text-sm font-medium text-forest-dark mb-1" for="role">I am a</label>
        <select id="role" name="role" required
                class="w-full rounded-xl border border-gray-200 bg-white px-3.5 py-2.5 text-sm transition-all hover:border-gray-300 focus:border-forest-light focus:outline-none focus:ring-2 focus:ring-forest-light/30">
          <option value="Farmer">Farmer</option>
          <option value="Customer" selected>Customer</option>
          <option value="DeliveryMan">Delivery Person</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-forest-dark mb-1" for="name">Full Name</label>
        <input id="name" name="name" type="text" required
               class="w-full rounded-xl border border-gray-200 px-3.5 py-2.5 text-sm transition-all hover:border-gray-300 focus:border-forest-light focus:outline-none focus:ring-2 focus:ring-forest-light/30" />
      </div>

      <div>
        <label class="block text-sm font-medium text-forest-dark mb-1" for="email">Email</label>
        <input id="email" name="email" type="email" required
               class="w-full rounded-xl border border-gray-200 px-3.5 py-2.5 text-sm transition-all hover:border-gray-300 focus:border-forest-light focus:outline-none focus:ring-2 focus:ring-forest-light/30" />
      </div>

      <div>
        <label class="block text-sm font-medium text-forest-dark mb-1" for="password">Password</label>
        <input id="password" name="password" type="password" required
               class="w-full rounded-xl border border-gray-200 px-3.5 py-2.5 text-sm transition-all hover:border-gray-300 focus:border-forest-light focus:outline-none focus:ring-2 focus:ring-forest-light/30" />
      </div>

      <div>
        <label class="block text-sm font-medium text-forest-dark mb-1" for="phone">Phone</label>
        <input id="phone" name="phone" type="text"
               class="w-full rounded-xl border border-gray-200 px-3.5 py-2.5 text-sm transition-all hover:border-gray-300 focus:border-forest-light focus:outline-none focus:ring-2 focus:ring-forest-light/30" />
      </div>

      <div>
        <label class="block text-sm font-medium text-forest-dark mb-1" for="address">Address</label>
        <input id="address" name="address" type="text"
               class="w-full rounded-xl border border-gray-200 px-3.5 py-2.5 text-sm transition-all hover:border-gray-300 focus:border-forest-light focus:outline-none focus:ring-2 focus:ring-forest-light/30" />
      </div>

      <button type="submit"
              class="w-full rounded-xl bg-forest text-white font-medium py-2.5 shadow-sm hover:bg-forest-light hover:shadow-lg hover:-translate-y-0.5 transition-all">
        Create Account
      </button>

      <p class="text-center text-sm text-gray-500">
        Already have an account?
        <a href="{{ url_for('login') }}" class="font-medium text-forest hover:text-forest-light">Sign in</a>
      </p>
    </form>
  </div>
</div>
{% endblock %}
